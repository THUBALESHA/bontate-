<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BONTATE KOPANANG - Attendance Register</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

.container {
    max-width: 550px;
    margin: 20px auto;
    padding: 15px;
}

.header {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    color: #666;
    font-weight: bold;
}

.form-box {
    background: white;
    margin-top: 15px;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

label {
    display: block;
    font-weight: bold;
    margin-top: 16px;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    font-family: Arial, sans-serif;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #25D366;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.required {
    color: red;
}

/* PHOTO */

.photo-section {
    margin-top: 20px;
    text-align: center;
}

.photo-preview {
    width: 190px;
    height: 190px;
    margin: 12px auto;
    border: 2px dashed #aaa;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #fafafa;
    color: #777;
}

.photo-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.photo-input {
    display: none;
}

.photo-button {
    display: inline-block;
    background: #333;
    color: white;
    padding: 14px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* BUTTONS */

.save-button {
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    border: none;
    border-radius: 9px;
    background: #25D366;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.save-button:hover {
    background: #1ebe5d;
}

.admin-button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #333;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>BONTATE KOPANANG</h1>

        <p>MEETING ATTENDANCE REGISTER</p>

    </div>


    <div class="form-box">

        <form id="attendanceForm">

            <!-- NAME -->

            <label for="name">
                Name <span class="required">*</span>
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter name"
                required
            >


            <!-- SURNAME -->

            <label for="surname">
                Surname <span class="required">*</span>
            </label>

            <input
                type="text"
                id="surname"
                placeholder="Enter surname"
                required
            >


            <!-- PHONE -->

            <label for="phone">
                Phone Number <span class="required">*</span>
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="e.g. 071 234 5678"
                required
            >


            <!-- ADDRESS -->

            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                placeholder="Enter address"
            >


            <!-- NOTES -->

            <label for="notes">
                Notes
            </label>

            <textarea
                id="notes"
                placeholder="Enter notes or comments..."
            ></textarea>


            <!-- PHOTO -->

            <div class="photo-section">

                <label>Attendance Photo</label>

                <div
                    class="photo-preview"
                    id="photoPreview">

                    No photo taken

                </div>


                <label
                    for="photo"
                    class="photo-button">

                    📷 TAKE PHOTO

                </label>


                <input
                    type="file"
                    id="photo"
                    class="photo-input"
                    accept="image/*"
                    capture="environment"
                >

            </div>


            <!-- SAVE -->

            <button
                type="submit"
                class="save-button">

                💾 SAVE ATTENDANCE

            </button>


            <!-- ADMIN -->

            <button
                type="button"
                class="admin-button"
                onclick="window.location.href='admin.html'">

                🔐 ADMIN

            </button>

        </form>

    </div>


    <div class="footer">

        BONTATE KOPANANG MEETING

    </div>

</div>


<script>

const photoInput =
    document.getElementById("photo");

const photoPreview =
    document.getElementById("photoPreview");

let photoData = "";


/* ================= PHOTO ================= */

photoInput.addEventListener(
    "change",
    function() {

        const file = this.files[0];

        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                photoData =
                    event.target.result;


                photoPreview.innerHTML =
                    `<img
                        src="${photoData}"
                        alt="Attendance Photo"
                    >`;

            };


        reader.readAsDataURL(file);

    }
);


/* ================= SAVE ================= */

document
.getElementById("attendanceForm")
.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name")
            .value
            .trim();


        const surname =
            document.getElementById("surname")
            .value
            .trim();


        const phone =
            document.getElementById("phone")
            .value
            .trim();


        const address =
            document.getElementById("address")
            .value
            .trim();


        const notes =
            document.getElementById("notes")
            .value
            .trim();


        const now =
            new Date();


        const record = {

            id: Date.now(),

            name: name,

            surname: surname,

            phone: phone,

            address: address,

            notes: notes,

            photo: photoData,

            date:
                now.toLocaleDateString(
                    "en-ZA"
                ),

            time:
                now.toLocaleTimeString(
                    "en-ZA"
                )

        };


        /* GET OLD RECORDS */

        let records =
            JSON.parse(
                localStorage.getItem(
                    "bontateAttendance"
                )
            ) || [];


        /* ADD NEW RECORD */

        records.push(record);


        /* SAVE */

        localStorage.setItem(
            "bontateAttendance",
            JSON.stringify(records)
        );


        /* SUCCESS */

        alert(
            "✅ Attendance saved successfully!"
        );


        /* CLEAR FORM */

        document
        .getElementById("attendanceForm")
        .reset();


        photoData = "";

        photoPreview.innerHTML =
            "No photo taken";


    }
);

</script>

</body>
</html>
