<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BONTATE KOPANANG MEETING - Attendance Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .container {
            max-width: 550px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
            color: #222;
        }

        .header h2 {
            margin: 8px 0 0;
            font-size: 18px;
            color: #666;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #25D366;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .photo-section {
            margin-top: 20px;
            text-align: center;
        }

        .photo-preview {
            width: 180px;
            height: 180px;
            margin: 10px auto;
            border: 2px dashed #aaa;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fafafa;
            color: #777;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-input {
            display: none;
        }

        .photo-button {
            display: inline-block;
            background: #444;
            color: white;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 9px;
            background: #25D366;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #1ebe5d;
        }

        .required {
            color: red;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>BONTATE KOPANANG</h1>
        <h2>MEETING ATTENDANCE REGISTER</h2>
    </div>

    <form id="attendanceForm">

        <label for="name">
            Name <span class="required">*</span>
        </label>
        <input
            type="text"
            id="name"
            placeholder="Enter name"
            required
        >

        <label for="surname">
            Surname <span class="required">*</span>
        </label>
        <input
            type="text"
            id="surname"
            placeholder="Enter surname"
            required
        >

        <label for="phone">
            Phone Number <span class="required">*</span>
        </label>
        <input
            type="tel"
            id="phone"
            placeholder="e.g. 071 234 5678"
            required
        >

        <label for="address">
            Address
        </label>
        <input
            type="text"
            id="address"
            placeholder="Enter address"
        >

        <label for="notes">
            Notes
        </label>
        <textarea
            id="notes"
            placeholder="Enter notes or comments..."
        ></textarea>

        <div class="photo-section">

            <label>Photo</label>

            <div class="photo-preview" id="photoPreview">
                No photo selected
            </div>

            <label for="photo" class="photo-button">
                📷 Take Photo
            </label>

            <input
                type="file"
                id="photo"
                class="photo-input"
                accept="image/*"
                capture="environment"
            >

        </div>

        <button type="submit" class="submit-button">
            📱 Submit to WhatsApp
        </button>

    </form>

    <div class="footer">
        BONTATE KOPANANG MEETING
    </div>

</div>

<script>

    const photoInput = document.getElementById("photo");
    const photoPreview = document.getElementById("photoPreview");

    // Show selected/taken photo
    photoInput.addEventListener("change", function () {

        const file = this.files[0];

        if (file) {

            const reader = new FileReader();

            reader.onload = function (event) {

                photoPreview.innerHTML =
                    '<img src="' + event.target.result + '" alt="Attendance Photo">';

            };

            reader.readAsDataURL(file);
        }
    });


    // Submit attendance details to WhatsApp
    document.getElementById("attendanceForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const surname = document.getElementById("surname").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const address = document.getElementById("address").value.trim();
        const notes = document.getElementById("notes").value.trim();

        const today = new Date();

        const date = today.toLocaleDateString("en-ZA");
        const time = today.toLocaleTimeString("en-ZA");

        const message =
`BONTATE KOPANANG MEETING
ATTENDANCE REGISTER

Name: ${name}
Surname: ${surname}
Phone Number: ${phone}
Address: ${address || "Not provided"}
Notes: ${notes || "None"}

Date: ${date}
Time: ${time}

Photo: ${photoInput.files.length > 0 ? "Photo taken/selected - please attach it in WhatsApp." : "No photo taken."}`;

        const whatsappNumber = "27683707042";

        const whatsappURL =
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            encodeURIComponent(message);

        window.open(whatsappURL, "_blank");

    });

</script>

</body>
</html>
